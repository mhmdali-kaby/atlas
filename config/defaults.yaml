# Atlas defaults — the single source of truth for every default number (brief §21).
#
# After editing, run:  cd backend && php artisan atlas:defaults
# That regenerates backend/config/atlas_defaults.php and
# services/shared/src/atlas_shared/defaults.py. A Pest test fails if they are stale.
#
# Rules:
#   - Percentages, money, ratios and R multiples are QUOTED strings (decimal), never floats.
#     The generator refuses to run if it finds an unquoted float.
#   - Counts, leverage multipliers and durations in seconds/minutes are integers.
#   - Percentages are in percent units: "1.0" means 1.0 % of equity.

env:
  default: demo            # brief §1.4: demo first
  allowed: [demo, live]

timezone:
  display: Asia/Baghdad    # brief §1.9: UTC in DB, Asia/Baghdad in UI
  storage: UTC

# Brief §14.3 risk table, exact values.
risk_profiles:
  default: balanced
  conservative:
    max_loss_per_trade_pct: "0.5"
    max_position_pct: "2"
    max_daily_loss_pct: "2"
    max_weekly_loss_pct: "5"
    max_leverage: 2
    max_open_positions: 3
    max_share_per_instrument_pct: "15"
    max_correlated_exposure_pct: "20"
    min_expected_r: "2.0"
    max_consecutive_losses: 2
  balanced:
    max_loss_per_trade_pct: "1.0"
    max_position_pct: "5"
    max_daily_loss_pct: "4"
    max_weekly_loss_pct: "10"
    max_leverage: 5
    max_open_positions: 6
    max_share_per_instrument_pct: "25"
    max_correlated_exposure_pct: "35"
    min_expected_r: "1.8"
    max_consecutive_losses: 3
  aggressive:
    max_loss_per_trade_pct: "2.0"
    max_position_pct: "10"
    max_daily_loss_pct: "8"
    max_weekly_loss_pct: "20"
    max_leverage: 10
    max_open_positions: 10
    max_share_per_instrument_pct: "40"
    max_correlated_exposure_pct: "50"
    min_expected_r: "1.5"
    max_consecutive_losses: 4

# Brief §14.6.
autonomy:
  default_level: 2                 # 1 advise only, 2 approve each trade, 3 auto within limits, 4 full auto
  levels: [1, 2, 3, 4]
  on_approval_timeout: reject
  # ATL-33 AC2: autonomy 3 (auto within limits) and 4 (full auto) place orders without the owner's
  # per-trade approval; neither the Risk Engine nor the Executor exist before Phase 2, so Settings
  # must refuse them until then. Raise this when the build phase that implements them ships.
  max_enabled_level: 2

# Brief §7.1 / §14.5. Volumes are USD notional over 24h.
markets:
  min_24h_volume_usd:
    crypto_perp: "20000000"
    stock_perp: "5000000"
    commodity_perp: "5000000"
    spot: "10000000"
  max_spread_bps: "8"
  max_instruments_per_day: 5
  max_instruments_per_day_min: 1
  max_instruments_per_day_max: 10
  # ATL-124, brief §14.5: Settings -> Markets. `kinds` is every asset-class toggle; enabled_markets
  # is the toggles that are on (dated futures and options start off). whitelist / blocklist are
  # instIds (stored upper-case); the blocklist always wins. list_max caps each list's length.
  kinds: [spot, crypto_perp, stock_perp, commodity_perp, futures, options]
  enabled_markets: [spot, crypto_perp, stock_perp, commodity_perp]
  whitelist: []
  blocklist: []
  avoid_stock_perps_outside_us_hours: true
  list_max: 500

# ATL-124, brief §14.4: Settings -> Money limits, in USDT. The Risk Engine uses whichever of the
# percentage (risk profile) and USDT limit is smaller. The brief gives no numbers; these start small
# on purpose (decision recorded in docs/DECISIONS.md) and the owner raises them in Settings.
money_limits:
  bot_capital_cap_usdt: "10000"
  max_usdt_per_trade: "1000"
  max_new_exposure_per_day_usdt: "5000"
  max_trades_per_day: 10

# ATL-124, brief §10: Risk Engine parameters (trading_core/risk), editable in Settings.
#   min_stop_atr_mult: stop distance >= this x ATR(1H). max_stop_pct: stop distance <= this % of entry.
#   slippage_bps: assumed slippage in the risk sizing. liq_buffer_mult: the estimated liquidation
#   price must sit at least this x the stop distance beyond the stop.
#   block_new_trades_minutes_before_high_impact_event: importance-5 event blackout (0 = off).
#   volatility_halt_sigma: 1-minute move that trips the circuit breaker on a held instrument.
#   market_data_max_age_seconds: older market data is stale (check 1). margin_buffer: margin must
#   be <= available balance x this.
risk_engine:
  min_stop_atr_mult: "0.8"
  max_stop_pct: "8"
  slippage_bps: "2"
  liq_buffer_mult: "2.0"
  block_new_trades_minutes_before_high_impact_event: 15
  volatility_halt_sigma: "6"
  market_data_max_age_seconds: 30
  margin_buffer: "0.9"

# ATL-127, brief §10: fixed rules of the Risk Engine's checks (trading_core/risk/engine.py). Not
# owner limits (those are in Settings above); these say how a check measures.
#   us_session: the US cash session for avoid_stock_perps_outside_us_hours, in its own timezone, so
#   DST comes from the tz database. weekdays are ISO (1 = Monday). Exchange holidays are not modelled.
#   atr_bar/atr_window/atr_lookback_bars: ATR(1H) for check 3 (Wilder, atlas_quant), from closed bars.
#   correlation_*: check 5's 30-day Pearson correlation of daily log returns; a pair with fewer
#   overlapping returns than min_obs is "unknown" (not counted as correlated, listed in the check).
#   maint_margin_ratio: maintenance margin assumed by check 7's isolated liquidation estimate.
#   fallback_taker_fee_rate: used by sizing until trade-fee rates are stored per instType; the
#   check records fee_source = "config_fallback" when it is used.
#   high_impact_importance: check 8's blackout counts economic events at or above this importance.
#   used_statuses: proposal statuses whose approved size counts as used today (daily exposure, trades).
#   evaluable_statuses: the only proposal statuses evaluate() accepts. passed = the vote passed;
#   risk_checked = an owner Edit re-runs the check (brief §12). Any other status (cancelled, rejected,
#   expired, sent, filled ...) is refused before anything is written, so it cannot re-enter approval.
risk_rules:
  us_session:
    timezone: America/New_York
    open: "09:30"
    close: "16:00"
    weekdays: [1, 2, 3, 4, 5]
  atr_bar: 1H
  atr_window: 14
  atr_lookback_bars: 120
  correlation_threshold: "0.8"
  correlation_lookback_days: 30
  correlation_min_obs: 20
  maint_margin_ratio: "0.005"
  fallback_taker_fee_rate: "0.0005"
  high_impact_importance: 5
  used_statuses: [sent, partially_filled, filled, closed]
  evaluable_statuses: [passed, risk_checked]

# ATL-141, brief §4.4, §11: Executor parameters (trading_core/execution), editable in Settings.
#   entry_timeout_minutes: an unfilled limit entry is cancelled after this long.
#   td_mode_perps: OKX tdMode for perps (one of td_modes_perps); spot always uses "cash".
#   stop_verify_seconds: after an entry, the server-side stop must be seen on OKX within this long,
#   or the position is market-closed and an alert raised. order_max_retries: tries per OKX call
#   (network/5xx), always with the same clOrdId. emergency_stop_atr_mult: reconciliation places a
#   stop this many ATR(1H) from entry on any position with no server-side stop and no proposal stop.
executor:
  entry_timeout_minutes: 30
  td_mode_perps: isolated
  td_modes_perps: [isolated, cross]
  stop_verify_seconds: 3
  order_max_retries: 3
  emergency_stop_atr_mult: "2.0"

# Brief §4.1. Checked against the OKX v5 docs (https://www.okx.com/docs-v5/en/) at build time.
okx:
  environments:
    demo:
      rest_base_url: https://www.okx.com
      ws_public_url: wss://wspap.okx.com:8443/ws/v5/public
      ws_private_url: wss://wspap.okx.com:8443/ws/v5/private
      ws_business_url: wss://wspap.okx.com:8443/ws/v5/business
      headers:
        x-simulated-trading: "1"
    live:
      rest_base_url: https://www.okx.com
      ws_public_url: wss://ws.okx.com:8443/ws/v5/public
      ws_private_url: wss://ws.okx.com:8443/ws/v5/private
      ws_business_url: wss://ws.okx.com:8443/ws/v5/business
      headers: {}

# Decision #235: trading_core polling intervals, in seconds.
sync:
  instruments_interval_seconds: 3600
  account_interval_seconds: 60
  bills_interval_seconds: 300
  # ATL-172: account/positions-history + trade/fills-history → positions_closed, fills. Later runs
  # page back only to the last successful run minus history_overlap_seconds.
  history_interval_seconds: 300
  history_overlap_seconds: 3600
  # A closed position is linked to the Atlas entry order whose first fill is within this many
  # seconds before the position's open time (cTime), or later but before it closed.
  history_link_tolerance_seconds: 5
  # trade/fills-history needs instType; these are paged every run.
  history_fill_inst_types: [SPOT, SWAP, FUTURES]

# ATL-172, brief §13 History: GET /api/portfolio/history and /api/exports/{fills|closed}.csv.
portfolio_history:
  per_page_default: 50
  per_page_max: 200
  # Decimal places of R in the API and CSV.
  r_scale: 2

# ATL-174, brief §13 Performance: GET /api/portfolio/performance.
portfolio_performance:
  ranges: ["1M", "3M", "YTD", "ALL"]
  default_range: ALL
  # Sharpe and Sortino need at least this many owner (Asia/Baghdad) days of equity.
  min_days_for_ratios: 10
  # Daily ratios are annualised by sqrt(annualisation_days); crypto and perps trade every day.
  annualisation_days: 365
  # Decimal places of each output kind (HALF_UP). Money averages keep 8 and are stripped.
  pct_scale: 2
  ratio_scale: 4
  money_scale: 8
  # Internal precision for means, variances and square roots.
  calc_scale: 24

# ATL-176, brief §13 Holdings: avg_cost_usd and change_24h_pct on GET /api/portfolio/holdings.
#   quotes: USD quotes searched, in order, for an asset's price instrument (CCY-<quote>[-SWAP]).
#   avg_cost_min_scale: decimals of avg_cost_usd; more when the spot instrument's tickSz has more.
#   avg_cost_small_scale: decimals when there is no spot instrument and the cost is below 1 USD.
#   change_bars: candle bars tried, in order, for the 24 h change (the newest close vs the newest
#     close at least 24 h before it).
portfolio_holdings:
  quotes: ["USDT", "USDC"]
  avg_cost_min_scale: 2
  avg_cost_small_scale: 8
  change_bars: ["1H", "1D"]
  change_window_hours: 24

# ATL-176, brief §13 Overview: GET /api/portfolio/benchmark?symbol=&range=. The series is the
# symbol's perp candle closes rebased to the equity curve's first point in the range.
#   symbols: symbol → instIds tried in order; the first in the env's universe is used (the demo
#     and live universes differ).
#   bars: range → candle bars tried in order (the first with candles in the range wins).
#   value_scale: decimals of each rebased value (HALF_UP, then trailing zeros stripped).
portfolio_benchmark:
  symbols:
    BTC: ["BTC-USDT-SWAP", "BTC-USDC-SWAP"]
    SPY: ["SPY-USDT-SWAP", "SPY-USDC-SWAP"]
    XAU: ["XAU-USDT-SWAP", "XAU-USDC-SWAP"]
  bars:
    1D: ["15m", "1H"]
    1W: ["1H", "4H"]
    1M: ["4H", "1D"]
    3M: ["1D"]
    YTD: ["1D"]
    ALL: ["1D"]
  value_scale: 8

# ATL-46, brief §7.3: the resumable history backfill in trading_core. How far back each dataset
# goes is backfill.depth_days (below, shared with the Data API); null depths walk back to
# full_history_floor, i.e. until OKX returns no older data. Datasets are created and claimed in
# dataset_order (daily and hourly bars before the 1m bars). One rate limiter is shared by all
# `concurrency` workers, so OKX's per-endpoint limits hold whatever the concurrency.
backfill_runner:
  interval_seconds: 300
  concurrency: 4
  # Brief §14.5 market toggles that are on by default; dated futures and options stay off.
  enabled_markets: [spot, crypto_perp, stock_perp, commodity_perp]
  dataset_order: ["candles:1D", "candles:1H", "candles:4H", funding, open_interest, "candles:15m", "candles:5m", "candles:1m"]
  # Open interest history is OKX rubik's per-currency series (crypto only); 1D goes back furthest.
  open_interest_period: 1D
  full_history_floor: "2009-01-01T00:00:00Z"
  # Postgres accepts at most 65535 bind parameters per statement; batches are also capped at batch_rows.
  max_bind_params: 65535
  batch_rows: 2000
  last_error_max_chars: 500

# ATL-47, brief §7.3 + decision #242: closed bars stay fresh by REST polling (no WebSocket feed in
# Phase 1). After each bar closes, the poller waits close_delay_seconds (OKX confirms a bar a moment
# after its close), then fetches the bars newer than the newest stored one for every instrument whose
# candles:<bar> backfill job is done. The job ticks every tick_seconds, so a closed bar is written
# within close_delay_seconds + tick_seconds plus the rate limiter's wait. Requests share one OKX client
# (one token bucket for market/candles), `concurrency` at a time, smallest bar first.
# Bar grids: OKX aligns 4H and 1D to UTC+8, so 1D bars open at 16:00 UTC (offset in minutes from 00:00 UTC).
candle_poller:
  tick_seconds: 1
  close_delay_seconds: 3
  concurrency: 4
  bars: ["1m", "5m", "15m", "1H", "4H", "1D"]
  page_limit: 100
# ATL-134, brief §7.5: OKX rubik long/short account ratio and taker volume, polled every
# interval_seconds at rubik period `period` for always_ccys + the crypto base currencies of the
# market feed's instruments (today's watchlist and open positions). taker_inst_type is rubik's
# instType (CONTRACTS = perps + futures). Upserted on (env, ccy, period, ts). The same tick stores
# public/open-interest for each -SWAP in that instrument set (open_interest, keyed by OKX ts), the
# 5-minute OI the derivatives features' 1h/4h windows need. It also reads market/index-tickers once
# per index_quote_ccys entry that a watched -SWAP's index (instFamily, BTC-USDT) uses, and writes the
# index into the atlas:md:<env>:<instId> hash as `index` (JSON {idxPx, ts}) and `index_ms` (OKX ts)
# for the basis (agents.derivatives.index_max_age_multiplier).
derivatives_poller:
  interval_seconds: 300
  period: 5m
  taker_inst_type: CONTRACTS
  always_ccys: [BTC, ETH]
  index_quote_ccys: [USDT, USDC]
  concurrency: 2
candle_grid:
  offset_minutes: { "1m": 0, "5m": 0, "15m": 0, "1H": 0, "4H": 0, "1D": 960 }

# ATL-125, brief §4.1/§4.2 + decision #249 (F): trading_core's public + business WebSocket market
# feed. URLs come from okx.environments.<env>.ws_public_url / ws_business_url. Subscriptions cover
# always_subscribe + today's (Asia/Baghdad) watchlist + open positions, re-read every
# subscriptions_refresh_seconds. An instrument with no message for market_data_max_age_seconds is
# stale. The latest ticker, mark price, books5 and last-message time per instrument live in the
# Redis hash <key_prefix>:<env>:<instId> (see atlas_shared.market_data). market.tick is published
# at most once per tick_publish_min_interval_seconds per instrument; candle.closed once per bar.
# Reconnects wait min(reconnect_max_seconds, reconnect_base_seconds * 2^attempt), scaled by a
# random factor in [1 - reconnect_jitter, 1].
market_ws:
  ping_interval_seconds: 25
  market_data_max_age_seconds: 30
  reconnect_base_seconds: 1
  reconnect_max_seconds: 60
  reconnect_jitter: "0.5"
  subscriptions_refresh_seconds: 15
  tick_publish_min_interval_seconds: 1
  stale_check_seconds: 5
  always_subscribe: ["BTC-USDT-SWAP"]
  public_channels: [tickers, mark-price, books5]
  business_channels: [candle1m, candle5m, candle1H]
  key_prefix: "atlas:md"
  snapshot_ttl_seconds: 86400

# ATL-47, brief §7.3 data-quality checks, every interval_seconds and on demand
# (POST /internal/quality/check). Each run looks at the last window_bars bars of every candle series
# whose backfill is done. Gaps = missing ts in the bar grid (re-fetched from REST; repaired_at when
# every missing bar exists). Duplicates = two or more rows in one grid slot (an off-grid ts).
# Zero-volume runs are logged, never "repaired" (stock perps have quiet hours). Outliers = a
# close-to-close log return beyond outlier_sigma standard deviations of the previous
# outlier_window returns (needs outlier_min_samples of them); outliers are logged, never deleted.
quality:
  interval_seconds: 900
  window_bars: 500
  outlier_sigma: 8
  outlier_window: 100
  outlier_min_samples: 30
  repair_page_limit: 100
  # A gap OKX itself never had (maintenance) stays open after this many REST attempts, not re-fetched forever.
  max_repair_attempts: 3

# ATL-35: InternalSignatureMiddleware rejects any /internal request body larger than this (by
# Content-Length, and by a running total while reading chunked bodies) before it is ever handed
# to the MAC check, so an unsigned caller cannot force trading_core to buffer an unbounded body.
internal_api:
  max_body_bytes: 1048576

# ATL-13, brief §18: `php artisan atlas:doctor` thresholds.
doctor:
  max_clock_drift_ms: 2000
  min_free_disk_gb: 5
  trading_core_timeout_seconds: 5
  # ATL-33 AC4: the one place this number lives. config/session.php's SESSION_LIFETIME
  # fallback and Doctor::security() both read it, so they cannot drift apart.
  max_session_lifetime_minutes: 15
  # ATL-95, decision #242: `claude --version` / `claude auth status --json` timeout.
  claude_cli_timeout_seconds: 15
  # The non-interactive prompt probe (`claude -p "ok" --max-turns 1`) used only when the
  # installed CLI has no status/auth command to ask instead; a real model turn is slower.
  claude_cli_probe_timeout_seconds: 30

# ATL-122, security round 11 finding 2: GET /api/agents/claude-status would otherwise spawn
# the claude CLI (and could fall back to a paid prompt turn) on every request. Rate-limited
# per user; the result is cached so a burst of calls shares one run of the checks, and the
# HTTP path never runs the `-p` probe (atlas:doctor on the CLI keeps it).
agents_api:
  claude_status_per_minute: 6
  claude_status_cache_seconds: 60

# ATL-10: account sync. Funding-account coins are valued in USD with OKX SPOT tickers
# (<CCY>-<quote> last price, quotes tried in order). Stablecoins count 1:1 with USD in Phase 0.
account_sync:
  usd_stablecoins: [USDT, USDC]
  price_quotes: [USDT, USDC]

# ATL-9, brief §2/§4.3: instrument universe sync. OPTION is off in Phase 0 (options disabled by default).
# asset_class is derived from OKX instCategory; unknown or missing categories become "other".
# Stock-category instruments whose base symbol is listed in stock_class_overrides get that class instead.
instruments:
  inst_types: [SPOT, SWAP, FUTURES]
  delisted_state: delisted_local
  category_asset_class:
    "1": crypto
    "3": stock
    "4": commodity
  stock_class_overrides:
    SPY: etf
    QQQ: etf
    IWM: etf
    TQQQ: etf
    SQQQ: etf
    US100: index

# ATL-7: OKX REST client behaviour. Rate limits are the documented per-endpoint OKX v5 limits
# (https://www.okx.com/docs-v5/en/), as "requests per per_seconds"; keys are paths after /api/v5/.
okx_rest:
  timeout_seconds: 10
  max_attempts: 3
  backoff_base_seconds: "0.5"
  backoff_max_seconds: "8"
  clock_sync_interval_seconds: 600
  # OKX body codes that mean "try again": 50001 service unavailable, 50011 rate limit, 50013 system busy.
  retryable_codes: ["50001", "50011", "50013"]
  rate_limits:
    public/time: { requests: 10, per_seconds: 2 }
    public/instruments: { requests: 20, per_seconds: 2 }
    market/tickers: { requests: 20, per_seconds: 2 }
    account/config: { requests: 5, per_seconds: 2 }
    account/balance: { requests: 10, per_seconds: 2 }
    account/positions: { requests: 10, per_seconds: 2 }
    account/positions-history: { requests: 10, per_seconds: 10 }
    account/bills: { requests: 5, per_seconds: 1 }
    account/bills-archive: { requests: 5, per_seconds: 2 }
    account/trade-fee: { requests: 5, per_seconds: 2 }
    asset/balances: { requests: 6, per_seconds: 1 }
    asset/deposit-history: { requests: 6, per_seconds: 1 }
    asset/withdrawal-history: { requests: 6, per_seconds: 1 }
    # ATL-45: public market data (brief §4.2). Limits per IP from the OKX v5 docs; see
    # docs/handoff/ATL-45-market-data-client.md for the doc date.
    market/candles: { requests: 40, per_seconds: 2 }
    market/history-candles: { requests: 20, per_seconds: 2 }
    public/funding-rate: { requests: 10, per_seconds: 2 }
    public/funding-rate-history: { requests: 10, per_seconds: 2 }
    public/open-interest: { requests: 20, per_seconds: 2 }
    public/mark-price: { requests: 10, per_seconds: 2 }
    # ATL-134: index prices for the basis (OKX v5 docs: 20 requests / 2 s per IP).
    market/index-tickers: { requests: 20, per_seconds: 2 }
    rubik/stat/contracts/open-interest-volume: { requests: 5, per_seconds: 2 }
    rubik/stat/contracts/long-short-account-ratio: { requests: 5, per_seconds: 2 }
    rubik/stat/taker-volume: { requests: 5, per_seconds: 2 }
    # ATL-141: trade and account-write endpoints (per user ID, OKX v5 docs, Oct 2026). GET and POST
    # trade/order share one bucket (the stricter reading of OKX's separate 60/2 s limits).
    trade/order: { requests: 60, per_seconds: 2 }
    trade/batch-orders: { requests: 60, per_seconds: 2 }
    trade/amend-order: { requests: 60, per_seconds: 2 }
    trade/cancel-order: { requests: 60, per_seconds: 2 }
    trade/close-position: { requests: 20, per_seconds: 2 }
    trade/order-algo: { requests: 20, per_seconds: 2 }
    trade/cancel-algos: { requests: 20, per_seconds: 2 }
    trade/orders-pending: { requests: 60, per_seconds: 2 }
    trade/orders-algo-pending: { requests: 20, per_seconds: 2 }
    trade/orders-history: { requests: 40, per_seconds: 2 }
    trade/fills: { requests: 60, per_seconds: 2 }
    trade/fills-history: { requests: 10, per_seconds: 2 }
    account/set-leverage: { requests: 20, per_seconds: 2 }
    account/max-size: { requests: 20, per_seconds: 2 }
  # ATL-45: the largest `limit` OKX accepts per request on paged market endpoints.
  page_limits:
    market/candles: 300
    market/history-candles: 100
    public/funding-rate-history: 100
    # ATL-141: trade read endpoints.
    trade/orders-pending: 100
    trade/orders-algo-pending: 100
    trade/orders-history: 100
    trade/fills: 100
    trade/fills-history: 100
    # ATL-141: most orders per trade/batch-orders and algo orders per trade/cancel-algos call.
    trade/batch-orders: 20
    trade/cancel-algos: 10
  # ATL-45: OKX codes that mean "too many requests". On these (and HTTP 429) the retry waits at least
  # one full rate-limit window of that endpoint before trying again.
  rate_limit_codes: ["50011"]

# ATL-36: Redis Streams event bus (brief §3.2). Each XADD trims its stream to about this many
# entries (MAXLEN ~), so the bus never grows without bound; Postgres is the record.
event_bus:
  stream_maxlen: 100000

# ATL-38: War Room API (brief §12, §16). `agents` lists the nine agents in brief §7 order:
# key = slug stored in warroom_messages.mentions; name = display name; handle = the one-word
# @mention the composer offers; aliases = extra spellings that also resolve. The slug and the
# name (spaces/punctuation removed) always resolve too. Matching is case-insensitive and
# ignores "_", "-" and "'".
warroom:
  page_limit_default: 50
  page_limit_max: 100
  post_per_minute: 30
  content_max_chars: 4000
  # ATL-89: atlas:bridge rebroadcasts warroom.thinking without storing it; a payload whose JSON
  # is longer than this many bytes has its longest strings cut to fit and gets truncated: true.
  thinking_max_bytes: 16384
  agents:
    orchestrator: { name: Orchestrator, handle: Orch, aliases: [] }
    market_scout: { name: Market Scout, handle: Scout, aliases: [] }
    news_intelligence: { name: News Intelligence, handle: News, aliases: [newsintel] }
    historian: { name: Historian, handle: Historian, aliases: [] }
    technical_analyst: { name: Technical Analyst, handle: Technical, aliases: [ta] }
    derivatives_sentiment: { name: "Derivatives & Sentiment", handle: Derivatives, aliases: [sentiment] }
    strategist: { name: Strategist, handle: Strategist, aliases: [] }
    devils_advocate: { name: "Devil's Advocate", handle: Devil, aliases: [da] }
    portfolio_manager: { name: Portfolio Manager, handle: PM, aliases: [portfolio] }

# ATL-48 (read by the Data API; ATL-46's backfill should create jobs from the same numbers):
# history depth per backfill dataset, in days back from when the job is created (brief §7.3:
# 1D full history, 1H 2 years, 15m 180 days, 1m 30 days; funding and OI as far back as OKX gives).
# null = full history ("as far back as OKX provides"); the API then reports no expected/percent
# until the job is done.
backfill:
  depth_days:
    "candles:1m": 30
    "candles:5m": 180
    "candles:15m": 180
    "candles:1H": 730
    "candles:4H": 730
    "candles:1D": null
    funding: null
    open_interest: null
    long_short_ratio: null
    taker_volume: null

# ATL-48: Settings → Data API (brief §14.10, §16). Re-sync and pause go to trading_core and are
# throttled per user; repaired quality issues stay listed for this many days.
data_api:
  resync_per_minute: 1
  pause_per_minute: 5
  repaired_issue_days: 7
  quality_issue_limit: 500

# ATL-66: Settings → Data sources API. The owner may set a source's poll interval only inside
# these bounds; writes (toggle, poll, set/remove key) are throttled per user.
# ATL-103: owner watchlist pin/remove/restore writes per user per minute.
watchlists_api:
  writes_per_minute: 30

data_sources_api:
  poll_seconds_min: 60
  poll_seconds_max: 86400
  api_key_max_length: 255
  writes_per_minute: 20

# ATL-57: news and calendar ingest (brief §7.2, decision #243). kind = transport
# (rss|api|calendar|earnings|sentiment); category = topic the UI groups by (exchange|crypto_news|
# markets_news|calendar|earnings|sentiment). NewsSourcesSeeder inserts one
# news_sources row per entry in `sources` (insert-only: an owner's later edits are kept).
# poll_seconds follow the brief §7.2 table: exchange 2 min, news 2-5 min, calendar 15 min,
# earnings daily, sentiment 15-60 min. A source that fails `failure_threshold` times in a row is
# disabled for `disable_minutes` (status degraded); a requires_key source with no key is needs_key.
# URLs were not re-checked against the live feeds (no network at build time): re-verify when the
# collectors are recorded on a networked run.
news:
  failure_threshold: 3
  disable_minutes: 30
  # atlas_ingest runtime (ATL-59): how often enabled rows are re-read, the tick of the poll loop,
  # and article-text extraction (trafilatura) for feeds that only carry a summary.
  reload_seconds: 60
  tick_seconds: 1
  extract:
    timeout_seconds: 8
    max_bytes: 2000000
    max_per_poll: 25
  # ATL-73: every source response (feed XML, provider JSON) is read with the same streamed cap as
  # article extraction uses, just more generous — a feed or an API page is naturally bigger than
  # one article. Content-Length over the cap is rejected before any read; an unbounded or
  # understated body is aborted the moment the cap is passed.
  max_response_bytes: 10000000
  # ATL-60: API collectors. Provider terms could not be re-read at build time (no network); the
  # values below follow the providers' published free tiers and are recorded in each module's
  # docstring. Finnhub's free tier allows 60 calls/minute per key (and 30/second); finnhub.news
  # spends at most max_calls_per_poll of them per poll (1 general + the rest company news,
  # rotating through the stock/ETF underlyings), leaving room for finnhub.calendar/earnings on the
  # same key. A 429 delays the source's next poll by Retry-After, else rate_limit_window_seconds.
  collectors:
    finnhub:
      max_calls_per_poll: 20
      request_interval_seconds: "0.25"
      company_news_days: 2
      rate_limit_window_seconds: 60
    cryptopanic:
      rate_limit_window_seconds: 60
    okx_announcements:
      language: en-US
  # Per-symbol feed templates expand {symbol} for every stock/ETF perp underlying in instruments.
  # ATL-65: headline RSS feeds poll every 60 s so an alert lands < 90 s after the story is posted
  # (brief §7.2 latency target); the per-symbol Yahoo template stays at 300 s (one request per symbol).
  # ATL-71: provider owns the API key (one key per provider, written to all its sources).
  # ATL-106 (decision #247 (4), brief §7.2): reputable / official decide a story cluster's status in
  # code. CONFIRMED = any official source or 2+ distinct reputable sources; REPORTED = exactly one
  # reputable; else RUMOUR. Official = the exchange's own announcements. Reputable = newsrooms with
  # editorial standards (CoinDesk, The Block, CNBC, MarketWatch) and Finnhub's news feed. Not
  # reputable: CryptoPanic (aggregated community/social posts), Cointelegraph and Decrypt (more
  # opinion and sponsored content), Yahoo per-symbol feeds (mixed press releases). The seeder and the
  # migration set these on install; the owner cannot edit them (read-only in the Data sources API).
  # covers: source keys this source takes over when it is enabled and keyed (decision #244:
  # Finnhub's calendar replaces ForexFactory); the API reports it as covered_by on those sources.
  sources:
    okx.announcements: { provider: okx, kind: api, category: exchange, name: OKX announcements, url: "https://www.okx.com/api/v5/support/announcements", poll_seconds: 120, requires_key: false, reputable: true, official: true }
    cryptopanic: { provider: cryptopanic, kind: api, category: crypto_news, name: CryptoPanic, url: "https://cryptopanic.com/api/v1/posts/", poll_seconds: 180, requires_key: true, reputable: false, official: false }
    rss.coindesk: { provider: coindesk, kind: rss, category: crypto_news, name: CoinDesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss", poll_seconds: 60, requires_key: false, reputable: true, official: false }
    rss.cointelegraph: { provider: cointelegraph, kind: rss, category: crypto_news, name: Cointelegraph, url: "https://cointelegraph.com/rss", poll_seconds: 60, requires_key: false, reputable: false, official: false }
    rss.theblock: { provider: theblock, kind: rss, category: crypto_news, name: The Block, url: "https://www.theblock.co/rss.xml", poll_seconds: 60, requires_key: false, reputable: true, official: false }
    rss.decrypt: { provider: decrypt, kind: rss, category: crypto_news, name: Decrypt, url: "https://decrypt.co/feed", poll_seconds: 60, requires_key: false, reputable: false, official: false }
    rss.cnbc: { provider: cnbc, kind: rss, category: markets_news, name: CNBC Top News, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114", poll_seconds: 60, requires_key: false, reputable: true, official: false }
    rss.marketwatch: { provider: marketwatch, kind: rss, category: markets_news, name: MarketWatch Top Stories, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", poll_seconds: 60, requires_key: false, reputable: true, official: false }
    rss.yahoo: { provider: yahoo, kind: rss, category: markets_news, name: Yahoo Finance (per symbol), url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s={symbol}&region=US&lang=en-US", poll_seconds: 300, requires_key: false, reputable: false, official: false }
    finnhub.news: { provider: finnhub, kind: api, category: markets_news, name: Finnhub news, url: "https://finnhub.io/api/v1/news", poll_seconds: 180, requires_key: true, reputable: true, official: false }
    finnhub.calendar: { provider: finnhub, kind: calendar, category: calendar, name: Finnhub economic calendar, url: "https://finnhub.io/api/v1/calendar/economic", poll_seconds: 900, requires_key: true, covers: [forexfactory.calendar], reputable: false, official: false }
    finnhub.earnings: { provider: finnhub, kind: earnings, category: earnings, name: Finnhub earnings calendar, url: "https://finnhub.io/api/v1/calendar/earnings", poll_seconds: 86400, requires_key: true, reputable: false, official: false }
    forexfactory.calendar: { provider: forexfactory, kind: calendar, category: calendar, name: ForexFactory weekly calendar, url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json", poll_seconds: 900, requires_key: false, reputable: false, official: false }
    alternative_me.fng: { provider: alternative_me, kind: sentiment, category: sentiment, name: Crypto Fear & Greed Index, url: "https://api.alternative.me/fng/", poll_seconds: 3600, requires_key: false, reputable: false, official: false }

  # ATL-64: local embeddings (atlas_ingest.embedding) and story clustering (atlas_ingest.clustering).
  # The model is multilingual (Arabic, CJK and European headlines join their English story) and
  # 384-d like news_items.embedding. Weights are cached outside the repository; ATLAS_MODEL_CACHE
  # overrides cache_dir.
  embedding:
    model: paraphrase-multilingual-MiniLM-L12-v2
    cache_dir: "~/Library/Caches/atlas/models"
    device: cpu
  # An item joins the best-scoring candidate cluster when score > join_threshold and the cluster
  # would still span <= window_hours (earliest to latest published_at). Candidates are the
  # candidate_limit nearest items (pgvector cosine, HNSW) published within window_hours. Per pair:
  #   score = cosine
  #         + title_weight      * rapidfuzz token_set_ratio(titles) / 100
  #         + number_weight     when both texts state the same figure ($48M = $48 million, 4,050 = 4050)
  #         + instrument_weight when the linked instruments overlap
  #         - conflict_penalty  when both have linked instruments and none are shared
  #         + event_type_weight when both have the same event_type
  # Tuned on the 300-headline fixture: pairwise F1 0.94 (in-sample).
  # novelty = 1 - max cosine to any item published in the novelty_hours before it (1.0 when none).
  clustering:
    window_hours: 12
    join_threshold: "0.8"
    title_weight: "0.2"
    number_weight: "0.2"
    instrument_weight: "0.1"
    conflict_penalty: "0.2"
    event_type_weight: "0.2"
    candidate_limit: 20
    novelty_hours: 72

  # ATL-65: news.alert on atlas.warroom (brief §7.2 step 6). An item alerts when its importance is
  # >= importance, or >= held_importance and it links an instrument the env holds a position in
  # (newest positions_snapshots tick). One alert per story cluster (news_clusters.alerted_at).
  # The alias table is re-synced from instruments at most every alias_resync_seconds.
  alerts:
    importance: 5
    held_importance: 4
    alias_resync_seconds: 60

  # ATL-63: rule-based headline importance (brief §7.2 step 4, decision #243), read by
  # atlas_ingest.classify.importance:
  #   score = base[event_type] (default_base when unlisted)
  #         + tier1_bonus           when the source is in tier1_sources (case-insensitive name or key)
  #         + strong_sentiment_bonus when |sentiment| >= strong_sentiment
  #         + multi_instrument_bonus when linked_count >= multi_instrument_min
  #         - unlinked_penalty      when linked_count == 0 and the type is not a market-wide one
  #                                 (macro_release, central_bank, geopolitics)
  #         + high_novelty_bonus    when novelty is known and >= high_novelty
  #         - low_novelty_penalty   when novelty is known and < low_novelty (a rehash of known news)
  #   clamped to 1..5.
  importance:
    min: 1
    max: 5
    default_base: 2
    base:
      hack_exploit: 4
      central_bank: 4
      macro_release: 4
      delisting: 4
      regulation: 3
      earnings: 3
      guidance: 3
      listing: 3
      ETF_flow: 3
      "M&A": 3
      lawsuit: 3
      token_unlock: 3
      geopolitics: 3
      supply_shock: 3
      product: 2
      partnership: 2
      other: 1
    market_wide_types: [macro_release, central_bank, geopolitics]
    tier1_bonus: 1
    tier1_sources: [reuters, bloomberg, associated press, ap, financial times, wall street journal, wsj, okx announcements, okx.announcements]
    strong_sentiment: "0.6"
    strong_sentiment_bonus: 1
    multi_instrument_min: 3
    multi_instrument_bonus: 1
    unlinked_penalty: 1
    high_novelty: "0.6"
    high_novelty_bonus: 1
    low_novelty: "0.15"
    low_novelty_penalty: 1

  # ATL-67: read-only /api/news, /api/news/clusters/{id}, /api/calendar, /api/sentiment/latest.
  # Earnings rows carry a date plus Finnhub's hour hint; the calendar places bmo/amc at these
  # US/Eastern wall-clock times (DST handled by Postgres), and dmh/unknown at 00:00 UTC.
  api:
    page_limit_default: 50
    page_limit_max: 100
    max_inst_ids: 50
    calendar_default_hours: 48
    earnings_timezone: America/New_York
    earnings_bmo_time: "09:30"
    earnings_amc_time: "16:00"
    default_sentiment_index: crypto_fng
  # ATL-61: calendar, earnings and sentiment collectors write economic_events, earnings_events and
  # market_sentiment (not news_items). ForexFactory impact -> economic_events.importance; 0 means
  # "not stored" (the column is CHECKed 1..5, and holidays are not tradeable events). Unknown
  # impacts get unmapped_importance. Finnhub's lowercase impacts use the same map, case-insensitively.
  calendar_importance:
    High: 5
    Medium: 3
    Low: 1
    Holiday: 0
  calendar:
    unmapped_importance: 1
    # Brief §7.2: calendar every 15 min (the source's poll_seconds), and every fast_poll_seconds
    # while any stored event with importance >= fast_min_importance is within ±fast_window_minutes.
    fast_poll_seconds: 60
    fast_window_minutes: 10
    fast_min_importance: 1
    # When finnhub.calendar is enabled, keyed and not degraded it is the calendar source and
    # forexfactory.calendar makes no request.
    finnhub_days_back: 1
    finnhub_days_ahead: 7
  earnings:
    days_back: 3
    days_ahead: 14
  sentiment:
    fng_index_key: crypto_fng
    fng_limit: 10

# ATL-79, brief §7.3: atlas_quant statistics (Historian, Risk Engine). Annualisation multiplies a
# per-bar statistic by sqrt(days_per_year[asset_class] * 86400 / bar_seconds): OKX perps trade
# around the clock, so a stock or commodity perp's bar count per day is the same as crypto's and only
# the day count differs. Unknown asset classes use days_per_year.other.
quant:
  days_per_year:
    crypto: 365
    stock: 252
    etf: 252
    index: 252
    commodity: 252
    other: 365
  default_asset_class: crypto
  # Wilder ATR: seed = mean of the first atr_window true ranges, then (prev * (w - 1) + TR) / w.
  atr_window: 14
  # Intraday-by-hour tables are given in UTC and in this display timezone.
  hour_table_timezone: Asia/Baghdad
  # ATL-82: event_study. Window in hours around each event; ATR-unit moves are reported for these
  # horizons (hours), using Wilder ATR(atr_window) of the bars closed by the event time.
  event_study:
    window_hours: [-24, 72]
    atr_horizons_hours: [1, 4, 24]
  # ATL-82: backtest_rule. Default slippage per fill (bps of price) when the caller passes none;
  # the period is cut into walk_forward_splits + 1 equal blocks (anchored walk-forward: fold j is
  # in-sample on blocks 0..j-1 and out-of-sample on block j). overfit_warning is raised when the
  # mean OOS Sharpe < overfit_sharpe_fraction x the mean IS Sharpe (IS Sharpe > 0).
  backtest:
    slippage_bps: 2
    walk_forward_splits: 3
    overfit_sharpe_fraction: "0.5"
  # ATL-81: find_analogs. Distance² = sum of weight * mean squared z-difference per feature group
  # (each feature column is z-normalised over the eligible windows only, so nothing after as_of
  # enters the scaling). Chosen neighbours never overlap each other or the query window.
  analogs:
    k: 20
    horizons: ["1h", "4h", "24h", "72h"]
    weights:
      returns_path: "1"
      realised_vol: "1"
      volume_z: "1"
      funding: "1"
  # ATL-81: seasonality. The funding buckets are the hours from -window to +window - 1 around the
  # nearest settlement time (UTC); every other bar falls in the "outside" bucket.
  seasonality:
    funding_hours_utc: [0, 8, 16]
    funding_window_hours: 2
  # ATL-80: detect_regime. A Gaussian HMM (seeded) on [log return %, ln(rolling vol %)]; a state whose
  # mean rolling vol is >= high_vol_ratio x the calmest state's is high_vol, the calmest state is
  # low_vol when some state clears that ratio, other states are trend_up/trend_down when the t-statistic
  # of their mean return (mean / std * sqrt(bars in the state)) is >= trend_t, else range. Falls back to ADX + vol percentile when
  # fewer than min_bars feature rows exist, the fit raises, or EM stops at n_iter without converging.
  regime:
    n_states: 3
    min_bars: 200
    vol_window: 20
    hmm_n_iter: 1000
    hmm_tol: "0.0001"
    hmm_covariance_type: full
    random_state: 42
    high_vol_ratio: "2.0"
    trend_t: "3.0"
    adx_window: 14
    adx_trend_threshold: "25"
    vol_percentile_lookback: 250
    high_vol_percentile: "80"
    low_vol_percentile: "20"
  # ATL-80: volatility_forecast. GARCH(1,1) (arch, normal errors) on percent log returns; EWMA with
  # ewma_lambda when there are fewer than garch_min_bars returns, the optimiser does not converge or the
  # fit is not stationary (alpha + beta >= 1). garch_mean: constant | zero.
  volatility:
    garch_min_bars: 100
    garch_mean: constant
    ewma_lambda: "0.94"
  # ATL-80: drawdown_profile reports the top_n deepest close-to-close drawdowns.
  drawdown:
    top_n: 5

# ATL-83, decisions #242/#245: the agent runtime (services/agents). Agents run on the owner's
# logged-in Claude Code CLI (subscription), never an API key, so budgets are tokens and turns per
# agent per Asia/Baghdad day; the SDK's cost is a notional display figure only.
#   models: tier -> the alias handed to the CLI's --model ("opus" = the strongest available model).
#   defaults: every agent's spec unless its roster entry overrides a field.
#     model / routine_model: model tier for normal runs / for cheap routine checks.
#     daily_tokens: tokens_in + tokens_out (input incl. cache reads/writes) per day.
#     daily_turns: model turns per day; max_turns_per_run: --max-turns for one run.
#   budget_warning_pct: share of either daily budget that publishes system.agent_budget once a day.
agents:
  budget_warning_pct: "80"
  # ATL-113, brief §14.7: bounds for the owner-editable agent settings (PATCH /api/settings keys
  # agents.<slug>.enabled|model|daily_tokens|daily_turns and agents.web.allow_domains|deny_domains).
  # Their defaults are agents.defaults + agents.roster and agents.web below.
  #   web_domains_max: entries per web domain list.
  settings_bounds:
    daily_tokens: { min: 1, max: 1000000000 }
    daily_turns: { min: 1, max: 100000 }
    web_domains_max: 200
  models:
    strong: opus
    standard: sonnet
    routine: haiku
  defaults:
    enabled: false
    model: standard
    routine_model: routine
    daily_tokens: 3000000
    daily_turns: 300
    max_turns_per_run: 25
  roster:
    orchestrator: {}
    market_scout: { model: strong, enabled: true }
    news_intelligence: { model: strong, enabled: true }
    historian: { model: strong, enabled: true }
    technical_analyst: {}
    derivatives_sentiment: {}
    strategist: { model: strong }
    devils_advocate: { model: strong }
    portfolio_manager: {}
  # ATL-92, brief §7.11/§9: the eval harness (python -m atlas_agents.evals).
  #   max_drop_points: `run` exits 1 when the overall pass rate (percent) is more than this many
  #     points below the agent's committed evals/<agent>/baseline.json.
  #   guard: the no_invented_numbers checker. auto = atlas_agents.numguard when installed, else the
  #     harness's built-in stub; numguard / stub force one.
  evals:
    max_drop_points: "5"
    guard: auto
  # ATL-87, brief §7.3: the history tools (atlas_agents.tools.history) and the Historian's
  # verdict rules (atlas_agents.schemas.enforce_verdict_rules).
  #   <tool>.bar / lookback_bars: the series each tool loads when the caller gives no bar/lookback,
  #     always ending at as_of (replay_as_of in replay, else now).
  #   backtest.taker_fee_rate: fraction (0.0005 = 0.05 %) used until a stored trade-fee read exists;
  #     a caller's costs.taker_fee_rate overrides it. warmup_bars load before the period to warm the
  #     indicators. slippage comes from quant.backtest.slippage_bps unless the caller passes one.
  #   event_study.event_types: event_type -> name regexes (case-insensitive) matched against
  #     economic_events.name, optionally limited to countries. "earnings" reads earnings_events for
  #     the instrument's base currency; earnings_hour_utc maps Finnhub's time field to an hour
  #     (approximate: US open/close in UTC, ignoring DST).
  #   verdict.min_n: below this many cases a verdict cannot be stronger than weakly_supports.
  history:
    compute_stats: { bar: 1D, lookback_bars: 365 }
    detect_regime: { bar: 1D, lookback_bars: 730 }
    volatility_forecast: { bar: 1H, lookback_bars: 2000 }
    drawdown_profile: { bar: 1D, lookback_bars: 3650 }
    seasonality: { bar: 1H, lookback_bars: 8760 }
    cross_asset_lead_lag: { bar: 1H, lookback_bars: 720 }
    find_analogs: { bar: 1H, window_bars: 24 }
    event_study:
      bar: 1H
      max_instruments: 10
      max_events: 200
      event_types:
        cpi: { names: ['\bCPI\b', 'consumer price index'], countries: [US, USD] }
        ppi: { names: ['\bPPI\b', 'producer price index'], countries: [US, USD] }
        fomc: { names: ['\bFOMC\b', 'federal funds rate', 'fed interest rate decision'], countries: [US, USD] }
        nfp: { names: ['non-?farm', '\bNFP\b'], countries: [US, USD] }
        gdp: { names: ['\bGDP\b'], countries: [US, USD] }
        retail_sales: { names: ['retail sales'], countries: [US, USD] }
        unemployment: { names: ['unemployment rate', 'jobless claims'], countries: [US, USD] }
      earnings_hour_utc: { bmo: 13, amc: 21, dmh: 17, default: 21 }
    backtest:
      bar: 1H
      lookback_bars: 8760
      warmup_bars: 250
      taker_fee_rate: "0.0005"
    verdict:
      min_n: 20
  # ATL-84, brief §6.2/§7.11 and rule 7: the agents' tool layer (atlas_agents.tools).
  #   max_result_tokens: a tool result whose JSON is estimated (chars / chars_per_token) above this
  #     is trimmed by code: every list is cut to trim_rows rows, then the longest list is halved
  #     until it fits; the result is marked truncated: true.
  #   injection_patterns: case-insensitive regexes; text passed through untrusted() that matches
  #     any of them is flagged as instruction-like so the caller can raise a War Room alert.
  # ATL-85, brief §6.2: okx_market / atlas_data read tools (Postgres only, decision #245).
  #   ticker_bar: the bar get_tickers and list_instruments' 24h volume are computed from.
  #   ticker_window_hours: the "24h" window for change and volume.
  #   mark_price_bar: get_mark_price answers with this bar's last close, labelled a proxy.
  #   series_limit: rows returned by get_long_short_ratio / get_taker_volume.
  #   min_correlation_obs: fewer overlapping daily returns than this gives corr null.
  market_tools:
    ticker_bar: 1H
    ticker_window_hours: 24
    mark_price_bar: 1m
    series_limit: 200
    min_correlation_obs: 3
  # ATL-106, brief §7.2: price_move_since_first_seen_atr on news clusters (atlas_quant.move_since_atr):
  #   (price now - close of the last `bar` closed by first_seen) / Wilder ATR(quant.atr_window) of the
  #   `bar` bars closed by first_seen, read from the last `history_bars` of them. Price now is the
  #   market_tools.mark_price_bar proxy (newest closed 1m close).
  news_price_move:
    bar: 1H
    history_bars: 200
  tools:
    max_result_tokens: 4000
    chars_per_token: 4
    trim_rows: 50
    injection_patterns:
      - '\bignore\s+(?:all\s+|any\s+|the\s+)?(?:previous|prior|above|earlier)\b'
      - '\bdisregard\s+(?:all\s+|any\s+|the\s+)?(?:previous|prior|above|earlier|your)\b'
      - '\bforget\s+(?:all\s+|everything\s+|your\s+)?(?:previous|prior|instructions|rules)\b'
      - '\byou\s+are\s+now\b'
      - '\bpretend\s+(?:to\s+be|you\s+are)\b'
      - '\bsystem\s+prompt\b'
      - '\bnew\s+instructions?\b'
      - '\boverride\s+(?:your|the|all)\s+(?:instructions|rules|limits|settings)\b'
      - '\bdeveloper\s+mode\b'
      - '\bjailbreak\b'
      - '<\s*/?\s*(?:system|assistant|user|untrusted_source|function_calls|invoke|tool_use)\b'
      - '\bmcp__\w+'
      - '"(?:tool_use|tool_call|function_call)"'
      - '\b(?:submit_proposal|cast_vote|post_message|place_order)\s*\('
  # ATL-100/ATL-121, brief §6.1/§7.10 (security round 9 low, round 11 medium finding 1):
  # news.fetch_article's live-fetch domain policy (atlas_agents.tools.news.domain_allowed) and the
  # PreToolUse hook that gates the built-in WebSearch tool for Market Scout/News Intelligence
  # (atlas_agents.access). Checked against the URL's host before the guarded SSRF fetch
  # (atlas_ingest.extract.Extractor) and against every redirect hop's host inside it, so a denied
  # or non-allow-listed host is never requested; WebSearch gets allowed_domains injected from the
  # same effective list. A host matches an entry when it equals it or is a subdomain of it
  # ("coindesk.com" matches "www.coindesk.com"). deny_domains wins over allow_domains.
  #
  # allow_domains ships non-empty: the host of every configured news_sources feed (§ news.sources
  # above), plus okx.com. ATL-121: an EMPTY allow_domains now means "nothing allowed" (not "any
  # public host"), so the owner widening it in Settings -> Agents is an explicit choice, not an
  # accidental "allow everything" left by clearing the field. Never applied to a stored article
  # body (fetch_article's "stored" origin).
  web:
    allow_domains:
      - api.alternative.me
      - cointelegraph.com
      - cryptopanic.com
      - decrypt.co
      - feeds.content.dowjones.io
      - feeds.finance.yahoo.com
      - finnhub.io
      - nfs.faireconomy.media
      - okx.com
      - search.cnbc.com
      - www.coindesk.com
      - www.okx.com
      - www.theblock.co
    deny_domains: []
  # ATL-88, brief §6.1: live warroom.thinking events while a run streams (atlas_agents.streaming).
  #   max_events_per_second: per run; deltas that arrive faster are coalesced into one event.
  #   event_text_max_chars: thinking/text in one event is cut to this (the final message's
  #     reasoning_md keeps everything).
  #   tool_input_max_chars / tool_output_max_chars: a tool call's JSON input and its output are
  #     cut to these in events and in the final message's tool_calls.
  streaming:
    max_events_per_second: 10
    event_text_max_chars: 4000
    tool_input_max_chars: 2000
    tool_output_max_chars: 2000
  # ATL-91, brief §7.11: the numeric hallucination guard (atlas_agents.numguard). Every number an
  # agent states is matched against the numeric leaves of that turn's tool outputs.
  #   rel_tolerance: |stated - tool| <= rel_tolerance x |tool| matches (0.005 = 0.5 %).
  #   abs_floor: the smallest absolute tolerance, so tiny values (0.0001) are not held to 0.5 % of
  #     themselves.
  #   rounding_aware: a stated number also matches a tool value that rounds to it at the precision
  #     written ("4.1%" matches 0.04132; "1.2M" matches 1,234,000).
  #   derive_pairs: also match the difference or ratio of two tool numbers.
  #   max_pair_leaves: only the first N distinct tool numbers are paired (N^2 candidates).
  numguard:
    rel_tolerance: "0.005"
    abs_floor: "0.0001"
    rounding_aware: true
    derive_pairs: true
    max_pair_leaves: 200
  # ATL-93, brief §6.3/§7.3/§8: the supervisor's triggers and output validation.
  #   output_retries: an invalid card is sent back to the agent this many times (with the
  #     validation errors) inside the same run; still invalid after that marks the agent degraded.
  #   schedule.<job>: Asia/Baghdad wall-clock time (HH:MM) of a daily job. A job runs once per
  #     Baghdad day (recorded in agent_runs), at that time or at the first tick after it.
  #   schedule.tick_seconds: how often the supervisor's own loop checks the schedule.
  #   regime_table.top_n: instruments in the 07:30 table, ranked by 24h quote volume.
  #   mentions.block_ms / batch: XREAD block time and entries per read on atlas.warroom.
  #   mentions.max_depth (ATL-101): an agent-written @mention is one deeper than the run that wrote
  #     it (owner, system and scheduled runs are depth 0); a mention at this depth or deeper starts
  #     no run, so with 2 the chain A -> B -> C stops before C.
  #   mentions.parent_wait_seconds (ATL-108): how long a mention handler waits for atlas:bridge to
  #     store an agent-written mention before replying to Main (so the reply carries reply_to).
  output_retries: 1
  schedule:
    historian_regime_table: "07:30"
    news_morning_brief: "07:30"
    scout_watchlist: "08:00"
    # ATL-110: the daily agent_scores job (atlas_agents.scoring), run per agent (Market Scout,
    # News Intelligence) for the previous Baghdad days in agents.scoring.lookback_days.
    scoring: "00:15"
    tick_seconds: 30
  # ATL-110, brief §7.1 Scoring / §7.2 latency / §9.3 + decision #247 (6): agent_scores written by
  # code (atlas_agents.scoring) at agents.schedule.scoring for each Baghdad day in
  # [today - lookback_days, today - 1]. Re-scoring a day overwrites its row (one per agent/env/day).
  #   scout.outcome_hours: a pick's move is close-to-close over this many hours from the watchlist's
  #     created_at (the day's current version); the day is skipped until that window has closed.
  #   scout.price_bar / max_price_lag_minutes: the prices at both ends are the close of the last
  #     price_bar candle closed by that instant, refused when it closed more than this long before.
  #   scout.atr_bar: the move is divided by Wilder ATR(quant.atr_window) of these bars closed by
  #     created_at (ATR(1D)); scout.atr_bars is how many bars are loaded for it.
  #   news.latency_target_seconds: the brief's ingest-to-alert target (< 90 s for RSS sources); the
  #     share of alerts within it is the News Intelligence row's hit_rate.
  scoring:
    lookback_days: 3
    scout:
      outcome_hours: 24
      price_bar: 1H
      max_price_lag_minutes: 120
      atr_bar: 1D
      atr_bars: 100
    news:
      latency_target_seconds: 90
  # ATL-132, brief §7.4: the Technical Analyst's deterministic precompute (atlas_agents.ta), per
  # timeframe. EMA/RSI/ATR/ADX are atlas_quant.indicators (the backtester's definitions).
  #   slope_bars: EMA slope = (EMA_t / EMA_{t-k} - 1) x 100 / k, in % per bar.
  #   zigzag_atr_mult: a swing is confirmed once price reverses this many ATR(atr_window) of that bar
  #     (the ATR of the confirming bar) from the running extreme.
  #   swings_reported: newest confirmed swings listed in the table.
  #   divergence_max_age_bars: a divergence flag needs its later swing pivot within this many bars.
  #   bb_width_lookback / squeeze_percentile: squeeze = Bollinger width's percentile among the last
  #     bb_width_lookback widths (share <= current, x100) is below squeeze_percentile.
  #   keltner: EMA(ema) ± mult x ATR(atr); breakout = the close outside a band.
  ta:
    timeframes: ["1D", "4H", "1H", "15m", "5m"]
    ema_spans: [20, 50, 200]
    slope_bars: 5
    adx_window: 14
    rsi_window: 14
    macd: { fast: 12, slow: 26, signal: 9 }
    roc_window: 10
    atr_window: 14
    zigzag_atr_mult: "1.5"
    swings_reported: 10
    divergence_max_age_bars: 60
    bollinger: { window: 20, std: "2" }
    bb_width_lookback: 180
    squeeze_percentile: "10"
    keltner: { ema: 20, atr: 10, mult: "2" }
  # ATL-134, brief §7.5: derivatives features (atlas_agents.derivatives.features), pure functions
  # over DB frames. funding: z-scores are (newest - mean) / std (ddof 1) of the rates with ts in the
  # last N days, newest included, null below min_funding_obs rows; annualised = current x funding
  # periods per year, the period being the median gap between stored rates (default_interval_hours
  # when fewer than two). sign_flip_days: sign changes between consecutive non-zero rates.
  # oi_windows_hours: OI and price change (%) from the newest value at least that old. A window is
  # "flat" when |price %| < price_dead_band_pct or |OI %| < oi_dead_band_pct. long_short_period /
  # taker_period: the rubik period read; taker_windows_hours: sum(buy) / sum(sell) over rows with
  # ts in the last N hours. max_age_minutes: the newest rubik / OI row older than this is null
  # (reason stale). window_stretch: the reference row of an N-hour change must be no older than
  # N x window_stretch before the newest row (so a 1D series never passes for a 1h change).
  # index_max_age_multiplier: the basis' stored index (polled every 5 min by derivatives_poller) is
  # stale when older than market_ws.market_data_max_age_seconds x this.
  # Zero OI or zero candle/taker volume marks the reading unreliable and nothing is computed on it.
  derivatives:
    funding_z_days: [7, 30]
    min_funding_obs: 3
    sign_flip_days: 3
    default_interval_hours: 8
    oi_windows_hours: [1, 4, 24]
    price_dead_band_pct: "0.25"
    oi_dead_band_pct: "0.5"
    long_short_period: 5m
    long_short_change_hours: 24
    taker_period: 5m
    taker_windows_hours: [1, 4]
    max_age_minutes: 30
    window_stretch: "1.5"
    index_max_age_multiplier: 10
  regime_table:
    top_n: 60
  mentions:
    block_ms: 5000
    batch: 50
    max_depth: 2
    parent_wait_seconds: 3
  # ATL-107, brief §7.2 + decision #247 (5): News Intelligence (atlas_agents.news_intelligence).
  #   alerts_per_hour: ingest news.alert envelopes that start an alert analysis per rolling hour;
  #     the rest are skipped and logged (counted in the supervisor's memory, so a restart resets it).
  #   asset_class_categories: asset class -> news_sources.category values that cover it. When every
  #     source of those categories is disabled, needs_key or degraded (disabled_until in the future),
  #     the class is listed in the brief card's degraded_asset_classes, and Market Scout (ATL-108) caps
  #     that class's convictions at agents.scout.partial_conviction_cap.
  #   mention_lookback_hours: the window an instrument brief covers (brief: last 72h).
  #   alert_parent_tries / alert_parent_wait_ms: atlas:bridge stores the alert message from the same
  #     stream, so the analysis looks it up this many times, this far apart, before replying in Main.
  #   morning_brief: the code-computed context of the 07:30 brief. top_stories clusters by max
  #     importance then item count over lookback_hours; events_hours of economic events at or above
  #     min_event_importance (at most max_events); top_instruments by item count over lookback_hours.
  news_intelligence:
    alerts_per_hour: 6
    asset_class_categories:
      crypto: [crypto_news]
      stock: [markets_news]
      etf: [markets_news]
      index: [markets_news]
      commodity: [markets_news]
    mention_lookback_hours: 72
    alert_parent_tries: 10
    alert_parent_wait_ms: 500
    morning_brief:
      lookback_hours: 24
      top_stories: 10
      events_hours: 48
      min_event_importance: 2
      max_events: 30
      top_instruments: 5
  # ATL-133, brief §7.4 (second part): structure precompute for the Technical Analyst
  # (atlas_agents.ta.levels / volume / patterns / microstructure; exact rules in each module's
  # docstring). ATR multiples are of the ATR the caller passes (the timeframe's Wilder ATR(14)).
  # Sessions are UTC days and weeks are ISO weeks (Monday 00:00 UTC).
  #   levels: swings in the last lookback_bars bars cluster into zones no wider than merge_atr_mult
  #     x ATR. strength = touch_weight x min(touches / touch_cap, 1) + recency_weight x (1 - bars
  #     since the last touch / lookback_bars). round_numbers: round_count levels each side of the
  #     price, for round_asset_classes only.
  #   volume: relative volume vs the mean of the rel_volume_bars bars before the bar; OBV trend =
  #     least-squares slope of OBV over obv_bars / mean volume of those bars, flat within
  #     +/- obv_flat_slope; the profile spreads each bar's volume evenly over its high-low range in
  #     profile_bins rows over the last profile_sessions sessions; the value area holds
  #     value_area_pct of it.
  #   patterns: breakout_retest, failed_breakout, range, flag (flag/pennant) and double (top/bottom);
  #     the geometric rule for each is in atlas_agents.ta.patterns.
  #   microstructure: book imbalance over the top imbalance_depths levels of each side.
  # ATL-135, brief §7.4: the Technical Analyst agent (atlas_agents.technical_analyst).
  #   history_bars: closed bars per timeframe loaded for okx_market.get_ta_table (§7.4 inputs).
  #   stale_bars / stale_check_bars: a run refuses (and posts a data alert) when the newest closed
  #     bar of any of these timeframes is more than stale_bars bars late.
  #   min_stop_atr_mult: the stop must be at least this many ATR(1H) from the entry-zone midpoint,
  #     else code turns the setup into "none".
  #   max_slippage_bps: estimated slippage at the Risk Engine's max size above this adds a
  #     thin-liquidity note. Max size = sizing equity x max_position_pct (settings).
  #   watchlist_max_runs: at most this many picks of one watchlist card are analysed.
  #   mention_max_instruments: at most this many instruments named in one @Technical mention.
  #   position_bar: the closed bar (candle.closed) that re-checks an instrument with an open position.
  #   zones_reported: the nearest zones per timeframe kept in the table (half below, half above price).
  technical_analyst:
    history_bars: { "1D": 400, "4H": 500, "1H": 500, "15m": 500, "5m": 300 }
    stale_bars: 2
    stale_check_bars: ["1H"]
    min_stop_atr_mult: "1.0"
    max_slippage_bps: "10"
    watchlist_max_runs: 10
    mention_max_instruments: 3
    position_bar: 1H
    zones_reported: 8
  ta_structure:
    levels:
      lookback_bars: 120
      merge_atr_mult: "0.3"
      touch_cap: 4
      touch_weight: "0.6"
      recency_weight: "0.4"
      round_count: 2
      round_asset_classes: [stock, etf, index, commodity]
    volume:
      rel_volume_bars: 20
      obv_bars: 20
      obv_flat_slope: "0.05"
      profile_sessions: 5
      profile_bins: 50
      value_area_pct: "70"
    patterns:
      breakout_buffer_atr: "0.1"
      retest_tol_atr: "0.25"
      breakout_max_age_bars: 20
      failed_within_bars: 3
      range_bars: 30
      range_max_atr: "4"
      range_edge_tol_atr: "0.25"
      range_min_touches: 2
      pole_bars: 8
      pole_min_atr: "3"
      flag_min_bars: 3
      flag_max_bars: 15
      flag_max_range_frac: "0.5"
      flag_max_retrace_frac: "0.5"
      double_peak_tol_atr: "0.25"
      double_min_depth_atr: "1"
      double_min_separation_bars: 5
    microstructure:
      imbalance_depths: [10, 50]
  # ATL-104, brief §7.1 steps 1-2 + decision #247 (2): Market Scout's code-run universe filter and
  # feature table (atlas_agents.scout). Every value is in force at the table's as_of (replay-bounded).
  #   universe: the filter. Per-market minimum 24h quote volume (USD) and max_spread_bps come from the
  #     settings row (Settings -> Markets: min_24h_volume_usd_<market>, max_spread_bps) and fall back
  #     to `markets` above. enabled_markets and blocklist are read from settings data when a later
  #     Settings -> Markets screen writes them, else from here. usd_quote_ccys: quote currencies whose
  #     volume counts as USD 1:1 (USDC and USD are treated as USDT; a small depeg is ignored); any
  #     other quote currency is rejected as volume_unknown. min_listed_days: OKX listTime must be more
  #     than this many days before as_of. Spread: Atlas stores no order book in Phase 1, so an
  #     instrument whose spread is unknown is kept and flagged spread_unknown.
  #   features: the per-instrument table. *_bars are closed bars loaded back from as_of.
  #     return_days: close-to-close returns on 1D bars. atr_bars: Wilder ATR(14) runs over the last
  #     atr_bars bars of each bar size. vol_ratio: realised vol of the last short_returns 1H returns
  #     over that of the last long_returns. volume_z_days: the latest closed day's quote volume vs the
  #     mean/std (ddof 1) of the days before it. ma_days: distance (%) of the last close to each SMA.
  #     breakout_days: last close above the prior N bars' high / below their low. funding_z_days: the
  #     latest funding rate vs the rates in the last N days (min_funding_obs rows, else null).
  #     oi_hours: OI change (%) from the newest row at least that old. long_short_period: rubik period
  #     read; long_short_max_age_hours: an older latest ratio is null. corr_days: daily log returns
  #     overlapping (min_corr_obs). references: the first instrument with 1D bars is the benchmark
  #     (SPY, then US100 in demo). catalyst_hours ahead; calendar_min_importance for economic events;
  #     calendar_countries: economic events from these countries are catalysts for every instrument;
  #     earnings match a stock/etf instrument's base currency. valid_minutes: valid_until - as_of.
  scout:
    # ATL-103, brief §8 + decision #247 (3): minutes after a watchlist is saved during which the owner
    # may pin, remove or restore items (POST /api/watchlists/...). Market Scout stamps
    # watchlists.edit_window_ends_at = created_at + this; Laravel uses the same rule when it is null.
    watchlist_edit_window_minutes: 10
    # ATL-108, brief §7.1 steps 4-6 + failure behaviour: the 08:00 pipeline (atlas_agents.agents.
    # market_scout). Code mentions @News (shortlist instruments with catalysts) and @Historian (top
    # historian_top_n), polls warroom_messages every poll_seconds for their replies (reply_to = the
    # mention's row) up to wait_seconds, then runs the Scout session. After the model: a feature
    # table older than stale_minutes or a teammate that did not reply makes the watchlist
    # partial_evidence with every conviction capped at partial_conviction_cap; a group of more than
    # max_correlated_picks picks/open positions linked by 30-day correlation above
    # prescore.correlation.threshold is refused once (in-run retry), then trimmed from the lowest
    # rank; blocked or owner-removed instruments are dropped. history_days: past days of own picks
    # shown to the model. link_seconds: how long to wait for the bridge to store the card before
    # watchlists.message_id is left null.
    # A class in agents.news_intelligence.asset_class_categories none of whose news sources is up is
    # listed in the card's degraded_asset_classes and its picks' convictions are capped at
    # partial_conviction_cap (cap_reason news_class_down).
    wait_seconds: 300
    poll_seconds: 2
    historian_top_n: 8
    stale_minutes: 15
    partial_conviction_cap: "0.5"
    max_correlated_picks: 2
    history_days: 5
    link_seconds: 5
    # ATL-109, brief §7.1 step 6: intraday re-runs (atlas_agents.scout.rerun), code triggers only.
    # A news.alert of importance >= rerun_alert_importance, or a universe instrument not on today's
    # watchlist whose latest closed 1H bar's |return| > spike_sigma x the stdev of its previous
    # spike_lookback_days of 1H returns (at least spike_min_returns of them), re-runs the watchlist.
    # The spike check runs every spike_check_seconds. Re-runs start only inside rerun_window
    # (Asia/Baghdad, start inclusive, end exclusive) and at most once per rerun_min_minutes.
    spike_sigma: "3"
    rerun_min_minutes: 60
    rerun_window: { start: "08:10", end: "23:00" }
    rerun_alert_importance: 5
    spike_check_seconds: 300
    spike_lookback_days: 30
    spike_min_returns: 100
    universe:
      enabled_markets: [spot, crypto_perp, stock_perp, commodity_perp]
      blocklist: []
      min_listed_days: 7
      usd_quote_ccys: [USDT, USDC, USD]
    features:
      daily_bars: 400
      hourly_bars: 800
      return_days: [1, 3, 7, 30]
      atr_bars: 100
      vol_ratio: { short_returns: 24, long_returns: 720 }
      volume_z_days: 30
      ma_days: [20, 50, 200]
      breakout_days: 20
      funding_z_days: 7
      min_funding_obs: 3
      oi_hours: 24
      long_short_period: 1H
      long_short_max_age_hours: 48
      corr_days: 30
      min_corr_obs: 20
      references:
        btc: [BTC-USDT-SWAP, BTC-USDT]
        spy: [SPY-USDT-SWAP, US100-USDT-SWAP, SPY-USDC-SWAP]
      news_hours: 24
      catalyst_hours: 48
      calendar_min_importance: 3
      calendar_countries: [US, USD]
      valid_minutes: 15
    # ATL-105, brief §7.1 step 3: the pre-score (atlas_agents.scout.prescore; components defined in
    # its docstring). score = sum(weight x component z). Each component's raw value is z-scored
    # cross-sectionally across every feature-table row (population std), clipped to +/- clip_z; a
    # null raw value contributes 0 and is listed in the row's null_components. shortlist_size rows
    # are kept by score (ties by inst_id); owner-pinned instruments are always added, marked pinned.
    #   earnings_points: added to catalyst_score's raw value when the instrument has its own
    #     earnings in the catalyst window. oi_scale_pct: |OI 24h change %| / this is one
    #     derivatives_signal part (|funding_z_7d| is the other).
    #   correlation: shortlist pairs whose 30-day daily-return correlation is above threshold are
    #     flagged (step 4: at most 2 correlated picks).
    prescore:
      shortlist_size: 25
      weights:
        momentum_z: "0.25"
        vol_expansion_z: "0.20"
        catalyst_score: "0.20"
        liquidity_score: "0.15"
        derivatives_signal: "0.10"
        regime_clarity: "0.10"
      clip_z: 3
      earnings_points: 3
      oi_scale_pct: 10
      correlation:
        threshold: "0.8"
        lookback_days: 30
