# Central banks, regulators and countries link to asset classes, never to an instrument.
asset_classes:
  - aliases: ["Fed", "FOMC", "Federal Reserve", "Powell", الاحتياطي الفيدرالي, 美联储]
    classes: [index, etf, stock, crypto, commodity]
  - aliases: ["ECB", "EZB", european central bank, "Bank of England", "BoE", "Bank of Japan", "BoJ", 日銀]
    classes: [index, etf, commodity]
  - aliases: ["PBOC", people's bank of china, 中国人民银行]
    classes: [commodity, index]
  - aliases: ["SEC", "CFTC", "MiCA"]
    classes: [crypto]
  - aliases: ["OPEC", "OPEC+", أوبك]
    classes: [commodity]

# Context rules drop a match the surrounding text shows is not the asset. `aliases` limits a rule to
# those alias strings (normalised); without it the rule covers every alias of the target. `unless`
# drops the link when any term occurs in the title or summary; `require_any` drops it unless one does.
# Terms are case-insensitive and match at a word start ("ski" covers "skiers").
context_rules:
  - target: AAPL
    aliases: [apple]
    unless: [harvest, orchard, fruit, cider, growers, apple pie, big apple]
  - target: XAU
    aliases: [gold, ذهب, الذهب]
    unless: [medal, olympic, gold-medal, champion, ميدالية, gold rush, golden boot, gold coast]
  - target: AMZN
    aliases: [amazon]
    unless: [rainforest, deforestation, river, basin, jungle, indigenous, tribe]
  - target: META
    aliases: [meta]
    unless: [meta-analysis, meta analysis, metadata]
  - target: XRP
    aliases: [ripple]
    unless: [ripple effect, ripple effects, ripples]
  - target: AVAX
    aliases: [avalanche]
    unless: [ski, snow, alps, mountain, climber, buried, rescue, avalanche of]
  - target: SHIB
    aliases: [shiba inu]
    unless: [dog, breed, puppy, puppies, pet]
  - target: CL
    aliases: [oil]
    unless: [oil painting, painting, olive oil, palm oil, cooking oil, essential oil, oil spill, motor oil]
  - target: XAG
    aliases: [silver]
    unless: [silver alert, silver lining, silverware, silver medal, silver screen, silver jubilee]
  - target: TSLA
    aliases: [tesla]
    unless: [tesla coil, nikola tesla]
  - target: XCU
    unless: [theft, thieves, stolen, cable theft, 銅メダル]
  - target: PEPE
    unless: [frog, cartoon, comic]
  - target: SOL
    aliases: [solana]
    unless: [solana beach, seawall]
  - target: ORCL
    aliases: [oracle]
    unless: [oracle manipulation, price oracle, oracle attack, oracle network, oracles]
  - target: MSTR
    aliases: [strategy]
    require_any: [bitcoin, btc, saylor, mstr, shares, stock, holdings, treasury]
  - target: CRCL
    aliases: [circle]
    require_any: [usdc, stablecoin, shares, stock, earnings, revenue, crcl, ipo, quarter]
  - target: OP
    aliases: [optimism]
    require_any: [op, token, tokens, mainnet, superchain, unlock, network, blockchain, ethereum, layer]
  - target: POL
    aliases: [polygon]
    require_any: [pol, token, network, blockchain, payments, matic, chain, crypto, stablecoin, fintech]
  - target: TRX
    aliases: [tron]
    require_any: [trx, network, blockchain, usdt, token, crypto, justin sun, fees]
  - target: COST
    aliases: [cost]
    require_any: [costco]

# Generated ticker aliases for these base symbols are cashtag-only ($AI), because the bare word is a
# common acronym or English word. Symbols of one or two letters are always cashtag-only unless listed
# above in `instruments` (OP is). Curated aliases are not affected by this list.
ticker_stoplist: [AI, ID, IP, IT, ME, US, UK, EU, CEO, CFO, ETF, SEC, FDA, IPO, GDP, CPI, PMI, ATH, DEX,
  CEX, NFT, DAO, API, APP, GAS, ONE, NEW, NOW, TOP, BIG, HOT, KEY, MOVE, PEOPLE, SUN, ACE, BIO, CORE,
  MEME, MAGIC, FLOW, GAME, MASK, SAND, RAY, BAND, ELF, OM, NEO, CAT, DOG, LOOKS, FUN, RARE, REAL, HIGH,
  LOW, WIN, MAX, MEW, NOT, ANY, ALL, FREE, FIRE, GOAT, TRUMP, STAR, GOLD, FED, USD, USDT, USDC]
