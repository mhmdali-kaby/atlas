# Curated entity-linking aliases for news (brief §7.2 step 3, decision #243, ATL-62).
#
# `python -m atlas_ingest.aliases sync` merges these with aliases generated from the active env's
# `instruments` (base symbol, BASE-USDT/USDC/USD family forms) and rewrites `instrument_aliases`.
# A curated alias whose base symbol is not listed in the active env is dropped, so it links nothing.
#
# How an alias string is matched (the rule lives in the alias text itself, so the DB row carries it):
#   all lowercase / caseless script  -> case-insensitive, whole word   ("bitcoin", "الذهب")
#   contains an uppercase letter      -> exact case or ALL CAPS, whole word ("Apple"/"APPLE", "OP")
#                                        an uppercase ticker also matches as a $cashtag ("$op")
#   starts with "$"                   -> only as a cashtag                ("$ONE")
#   ends with "*"                     -> word prefix (inflected scripts)  ("биткоин*")
#   only CJK / kana / hangul          -> substring (no word spaces)       ("比特币")
# Arabic aliases may carry the prefixes و ف ب ل ك ; Arabic diacritics, tatweel and alef forms are
# normalised away on both sides, so write them plain.

instruments:
  BTC: [bitcoin, bitcoins, "BTC", البيتكوين, بيتكوين, 比特币, ビットコイン, 비트코인, биткоин*]
  ETH: [ethereum, ether, "ETH", الإيثريوم, إيثريوم, 以太坊, イーサリアム, 이더리움, эфириум*]
  ETC: [ethereum classic, "ETC"]
  BCH: [bitcoin cash, "BCH"]
  SOL: [solana, "SOL", سولانا, 索拉纳]
