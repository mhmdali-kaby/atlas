# ATL-63: finance sentiment lexicon for news headlines (brief §7.2 step 4, decision #243).
#
# Read by atlas_ingest.classify.sentiment. Words are matched on lower-cased tokens (letters, digits,
# apostrophes, hyphens). Weights are decimal strings: positive words push a headline up, negative
# words push it down. A negator within `negation_window` tokens before a sentiment word flips its
# sign and scales it by `negation_scale`; an intensifier directly before or after it multiplies it by its own
# factor. The raw sum s is squashed to s / sqrt(s^2 + alpha), so the result is always inside -1..1,
# then rounded to 3 decimal places. English only for now: non-English headlines score 0 until
# News Intelligence (patch E) translates titles.

alpha: "4"
negation_window: 3
negation_scale: "0.75"

negators: [not, no, never, "n't", without, neither, nor, "doesn't", "don't", "didn't", "isn't", "wasn't", "won't", "cannot", "can't", fails, failed, unlikely]

intensifiers:
  sharply: "1.5"
  steeply: "1.5"
  record: "1.3"
  massive: "1.5"
  huge: "1.5"
  very: "1.3"
  heavily: "1.4"
  biggest: "1.3"
  slightly: "0.5"
  modestly: "0.6"
  marginally: "0.5"

