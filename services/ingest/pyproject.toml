[project]
name = "atlas-ingest"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["atlas-shared", "httpx>=0.27", "feedparser>=6", "pydantic>=2.9", "pyyaml>=6", "sqlalchemy>=2.0"]

[project.entry-points."atlas_ingest.evaluation"]
linker = "atlas_ingest.evaluation.linking_stage:link_headline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ingest"]

[tool.uv.sources]
atlas-shared = { workspace = true }
