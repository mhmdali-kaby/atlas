[project]
name = "atlas-shared"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pyyaml>=6", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "redis>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_shared"]

