[project]
name = "atlas-agents"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["atlas-shared", "claude-agent-sdk>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_agents"]

[tool.uv.sources]
atlas-shared = { workspace = true }
