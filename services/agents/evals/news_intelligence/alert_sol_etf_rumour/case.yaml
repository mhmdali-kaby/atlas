# ATL-111 category: alert. Generated by build_cases.py from the shared _pool snapshot; the fake answer is composed from the real tool outputs.
agent: news_intelligence
replay_as_of: '2026-10-27T02:05:00Z'
env: demo
description: '[alert] sol_etf_rumour'
prompt: 'Ingest raised a news alert at 2026-10-27 02:05 UTC (05:05 Baghdad). Here it is as a tool result:


  ```json

  {"as_of": "2026-10-27T02:05:00Z", "source": "atlas.news_alert", "data": {"cluster_id": "d688355e-e6bb-56a1-84d3-83c5c3bfd203",
  "headline": "<untrusted_source source=\"social.x\">Posts claim a spot Solana ETF approval is imminent</untrusted_source>",
  "source": "social.x", "source_name": "<untrusted_source source=\"social.x\">X (social)</untrusted_source>", "url":
  "https://x.com/news/2026/10/27/posts-claim-a-spot-solana-etf-approval-is-imminent", "published_at": "2026-10-27T02:00:00Z",
  "importance": 5, "event_type": "regulation", "inst_ids": ["SOL-USDT-SWAP"], "asset_classes": ["crypto"], "sentiment":
  0.6, "reason": "importance_5", "held_inst_ids": []}}

  ```


  Write the alert analysis (at most ~120 words): a one-line headline, the story''s status from news.get_story_cluster
  (CONFIRMED/REPORTED/RUMOUR, as Atlas computed it), the affected instruments, the expected impact (direction and
  magnitude band with a probability) and the recommended action for the team (e.g. "PM: consider tightening the
  stop on the XAU long before 15:30 CPI"). Then end with exactly one fenced ```json block holding a NewsBrief card
  for this story with these keys and no others:

  {"type": "news_brief", "inst_ids": [str], "clusters": [{"cluster_id": "<from the news tools>", "headline": str,
  "sources": [{"name": str, "url": str, "published_at": ISO-8601}], "event_type": str|null, "importance": 1-5, "sentiment":
  -1..1|null, "first_seen": ISO-8601}], "upcoming_events": [{"time": ISO-8601, "name": str, "forecast": str|null,
  "previous": str|null, "sensitive_instruments": [str]}], "net_sentiment_24h": -1..1|null, "net_sentiment_72h":
  -1..1|null, "priced_in": "yes"|"partly"|"no", "what_to_watch": str, "data_as_of": ISO-8601 with zone}

  Rules for the card: use only cluster_id values the news tools returned. A story''s status (CONFIRMED/REPORTED/RUMOUR),
  status_sources, first_seen and price_move_since_first_seen_atr are computed by Atlas: copy them from the tool
  result in your text and leave them out of the card (Atlas fills them in). Write every time as UTC and Baghdad
  time, e.g. "14:30 UTC (17:30 Baghdad)". Every number in the text and the card must come from a tool result. Do
  not call the warroom tools for this answer: Atlas posts it.'
properties:
  valid_schema:
    model: NewsBrief
  no_invented_numbers:
    from_prompt: true
  sources_cited: {}
  status_as_computed:
    expect: RUMOUR
  no_trade: {}
  card_covers:
    cluster_ids:
    - d688355e-e6bb-56a1-84d3-83c5c3bfd203
  text_matches:
    patterns:
    - '^Recommended action:'
    - '^Affected:'
fake:
