# ATL-94 category: event. Generated by build_cases.py from the shared _pool snapshot; the fake answer is composed from the real tool outputs.
agent: historian
replay_as_of: '2026-10-20T00:00:00Z'
env: demo
description: '[event] @Historian what do crypto perps usually do around FOMC rate decisions?'
prompt: 'War Room message from the owner (human), id 003e66ab905c5ffb887d7568e90ba0be:


  > @Historian what do crypto perps usually do around FOMC rate decisions?


  Answer it with statistics from your history tools. Write a short answer (at most ~180 words) for the War Room,
  then end with exactly one fenced ```json block holding a HistoryVerdict card with these keys and no others:

  {"type": "history_verdict", "question": str, "inst_id": str|null, "bar": str|null, "period": "YYYY-MM-DD..YYYY-MM-DD"|null,
  "n": int, "distribution": {"<horizon e.g. 24h>": {"median": num, "p10": num, "p90": num, "pct_positive": 0-100,
  "n": int}}, "base_rate": {same shape}, "regime": {"label": str, "probability": 0-1|null, "days_in_regime": num|null}|null,
  "stop_noise_check": {"stop_distance_atr": num, "median_4h_range_atr": num, "verdict": "ok"|"inside_noise"}|null,
  "overfit_warning": bool, "verdict": "supports"|"weakly_supports"|"does_not_support"|"contradicts", "key_stat":
  str, "data_quality_notes": [str], "data_as_of": ISO-8601 with zone}

  Every number in the answer and the card must come from a tool result. Do not call the warroom tools for this answer:
  Atlas posts your answer as the reply to this message.'
properties:
  valid_schema:
    model: HistoryVerdict
  no_invented_numbers: {}
  verdict_in:
    values:
    - supports
    - weakly_supports
    - does_not_support
    - contradicts
  no_trade: {}
  mentions_n:
    min: 0
fake:
  steps:
  - tool: history.event_study
    input:
      window:
      - -24
      - 72
      bar: 4H
      lookback_years: 1
      asset_class: crypto
      event_type: fomc
  - text: "History supports treating FOMC as a volatility event for AVAX-USDT-SWAP, BTC-USDT-SWAP, DOGE-USDT-SWAP,\
      \ ETH-USDT-SWAP, HYPE-USDT-SWAP, LINK-USDT-SWAP, SOL-USDT-SWAP, XRP-USDT-SWAP. Sample: 5 events, n = 21 cases\
      \ on 4H bars (as_of 2026-10-20T00:00:00Z); 18 cases fell outside the loaded history. Return 24h after the\
      \ event: median -1.05% (p10 -4.39%, p90 +6.95%). Key stat: mean absolute move 1.76 ATR at 24h after fomc (n\
      \ = 21). Direction is not reliable from this sample, only the size of the move.\n\n```json\n{\n \"type\":\
      \ \"history_verdict\",\n \"question\": \"@Historian what do crypto perps usually do around FOMC rate decisions?\"\
      ,\n \"inst_id\": null,\n \"bar\": \"4H\",\n \"period\": \"2026-04-03..2026-10-20\",\n \"n\": 21,\n \"distribution\"\
      : {},\n \"base_rate\": {},\n \"regime\": null,\n \"stop_noise_check\": null,\n \"overfit_warning\": false,\n\
      \ \"verdict\": \"supports\",\n \"key_stat\": \"mean absolute move 1.76 ATR at 24h after fomc (n = 21)\",\n\
      \ \"data_quality_notes\": [\n  \"AVAX-USDT-SWAP 4H: unrepaired interior gap(s) 2026-08-02T00:00:00Z to 2026-08-03T16:00:00Z,\
      \ 2026-09-15T04:00:00Z to 2026-09-16T04:00:00Z\",\n  \"DOGE-USDT-SWAP 4H: unrepaired interior gap(s) 2026-08-13T16:00:00Z\
      \ to 2026-08-16T12:00:00Z\",\n  \"LINK-USDT-SWAP 4H: unrepaired interior gap(s) 2026-09-01T00:00:00Z to 2026-09-05T00:00:00Z\"\
      \n ],\n \"data_as_of\": \"2026-10-20T00:00:00Z\"\n}\n```"
