# ATL-94 category: backtest. Generated by build_cases.py from the shared _pool snapshot; the fake answer is composed from the real tool outputs.
agent: historian
replay_as_of: '2026-10-20T00:00:00Z'
env: demo
description: '[backtest] @Historian I tuned this SOL-USDT-SWAP 4H rule until it looked great: SMA 3/7 long with
  a 1.7% stop. Is it real?'
prompt: 'War Room message from the owner (human), id 5734e7f0adeb50fbb9f035f69512ee90:


  > @Historian I tuned this SOL-USDT-SWAP 4H rule until it looked great: SMA 3/7 long with a 1.7% stop. Is it real?


  Answer it with statistics from your history tools. Write a short answer (at most ~180 words) for the War Room,
  then end with exactly one fenced ```json block holding a HistoryVerdict card with these keys and no others:

  {"type": "history_verdict", "question": str, "inst_id": str|null, "bar": str|null, "period": "YYYY-MM-DD..YYYY-MM-DD"|null,
  "n": int, "distribution": {"<horizon e.g. 24h>": {"median": num, "p10": num, "p90": num, "pct_positive": 0-100,
  "n": int}}, "base_rate": {same shape}, "regime": {"label": str, "probability": 0-1|null, "days_in_regime": num|null}|null,
  "stop_noise_check": {"stop_distance_atr": num, "median_4h_range_atr": num, "verdict": "ok"|"inside_noise"}|null,
  "overfit_warning": bool, "verdict": "supports"|"weakly_supports"|"does_not_support"|"contradicts", "key_stat":
  str, "data_quality_notes": [str], "data_as_of": ISO-8601 with zone}

  Every number in the answer and the card must come from a tool result. Do not call the warroom tools for this answer:
  Atlas posts your answer as the reply to this message.'
properties:
  valid_schema:
    model: HistoryVerdict
  no_invented_numbers: {}
  verdict_in:
    values:
    - does_not_support
    - contradicts
  no_trade: {}
  mentions_n:
    min: 0
fake:
  steps:
  - tool: history.backtest_rule
    input:
      inst_ids:
      - SOL-USDT-SWAP
      rule_spec:
        name: sma_3_7_stop
        side: long
        indicators:
          f:
            kind: sma
            window: 3
          s:
            kind: sma
            window: 7
        entry:
        - left: f
          op: crosses_above
          right: s
        exit:
        - left: f
          op: crosses_below
          right: s
        stop_pct: 1.7
      bar: 4H
      splits: 3
  - text: "History does not support the rule sma_3_7_stop on SOL-USDT-SWAP. Sample: 4H bars 2022-10-21T00:00:00Z\
      \ to 2026-10-20T00:00:00Z, n = 98 trades (as_of 2026-10-20T00:00:00Z), taker fee 0.0005 and 2.0 bps slippage,\
      \ funding included. Full period: total return +10.21%, Sharpe 0.58, max drawdown -53.06%, win rate +26.53%.\
      \ Walk-forward over 3 folds: mean in-sample Sharpe 2.45 vs out-of-sample -1.66. Out-of-sample is much worse\
      \ than in-sample, so the rule is probably overfit.\n\n```json\n{\n \"type\": \"history_verdict\",\n \"question\"\
      : \"@Historian I tuned this SOL-USDT-SWAP 4H rule until it looked great: SMA 3/7 long with a 1.7% stop. Is\
      \ it real?\",\n \"inst_id\": \"SOL-USDT-SWAP\",\n \"bar\": \"4H\",\n \"period\": \"2026-04-03..2026-10-20\"\
      ,\n \"n\": 98,\n \"distribution\": {},\n \"base_rate\": {},\n \"regime\": null,\n \"stop_noise_check\": null,\n\
      \ \"overfit_warning\": true,\n \"verdict\": \"does_not_support\",\n \"key_stat\": \"OOS Sharpe -1.66 vs IS\
      \ 2.45 over 98 trades\",\n \"data_quality_notes\": [\n  \"no interior gaps in the window\"\n ],\n \"data_as_of\"\
      : \"2026-10-20T00:00:00Z\"\n}\n```"
  - result:
      tokens_in: 3400
      tokens_out: 420
      turns: 2
