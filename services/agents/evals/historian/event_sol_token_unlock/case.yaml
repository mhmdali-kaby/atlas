      inst_id: SOL-USDT-SWAP
      bar: 4H
      lookback: 120
  - text: "History cannot answer this: history.event_study has no such event type (event_type must be one of: earnings,\
      \ cpi, fomc, gdp, nfp, ppi, retail_sales, unemployment). No past events were studied, so n = 0 cases and history\
      \ does not support any claim about the move. For scale only: SOL-USDT-SWAP 4H ATR is 2.56% of price over n\
      \ = 120 bars to 2026-10-20T00:00:00Z, with realised volatility 0.71 annualised; that is ordinary noise, not\
      \ an event study.\n\n```json\n{\n \"type\": \"history_verdict\",\n \"question\": \"@Historian what does SOL-USDT-SWAP\
      \ do around token unlocks?\",\n \"inst_id\": \"SOL-USDT-SWAP\",\n \"bar\": null,\n \"period\": null,\n \"\
      n\": 0,\n \"distribution\": {},\n \"base_rate\": {},\n \"regime\": null,\n \"stop_noise_check\": null,\n \"\
      overfit_warning\": false,\n \"verdict\": \"does_not_support\",\n \"key_stat\": \"no event history for this\
      \ event type (n = 0)\",\n \"data_quality_notes\": [\n  \"event_study supports only calendar macro events and\
      \ earnings\"\n ],\n \"data_as_of\": \"2026-10-20T00:00:00Z\"\n}\n```"
  - result:
      tokens_in: 3800
      tokens_out: 420
      turns: 3
