[project]
name = "atlas-quant"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
description = "Deterministic market statistics for the Historian and the Risk Engine (decision #245)."
dependencies = [
  "atlas-shared",
  "numpy>=2",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "arch>=7",
  "hmmlearn>=0.3",
  "vectorbt>=0.27",
  "pydantic>=2.9",
  "sqlalchemy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_quant"]

[tool.uv.sources]
atlas-shared = { workspace = true }
