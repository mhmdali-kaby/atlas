[project]
name = "atlas-trading-core"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["atlas-shared", "atlas-quant", "fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "websockets>=13", "python-okx>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_core"]

[tool.uv.sources]
atlas-shared = { workspace = true }
atlas-quant = { workspace = true }
